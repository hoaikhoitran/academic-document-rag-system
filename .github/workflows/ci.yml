name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  dotnet:
    name: ASP.NET Core
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOLUTION_PATH: dotnet-mvc/HoaiKhoi_SE1950_A01/HoaiKhoi_SE1950_A01.sln
      WEB_PROJECT_PATH: dotnet-mvc/HoaiKhoi_SE1950_A01/AcademicDocumentRagSystem.MVC/AcademicDocumentRagSystem.MVC.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('dotnet-mvc/**/*.csproj', 'dotnet-mvc/**/*.props', 'dotnet-mvc/**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build
        run: dotnet build "$SOLUTION_PATH" --configuration Release --no-restore --verbosity minimal

      - name: Detect .NET test projects
        id: dotnet-tests
        shell: bash
        run: |
          test_projects="$(find dotnet-mvc -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) -print)"

          if [[ -n "$test_projects" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$test_projects"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=.NET tests::No .NET test project found; restore, build and publish are still verified."
          fi

      - name: Run .NET tests
        if: steps.dotnet-tests.outputs.found == 'true'
        run: dotnet test "$SOLUTION_PATH" --configuration Release --no-build --verbosity normal

      - name: Verify publish output
        run: >
          dotnet publish "$WEB_PROJECT_PATH"
          --configuration Release
          --no-build
          --output "$RUNNER_TEMP/mvc-publish"

  rag:
    name: FastAPI RAG
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      APP_ENV: test
      API_KEY: ""
      MOCK_LLM: "true"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"

    defaults:
      run:
        working-directory: rag-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run pytest
        run: |
          mkdir -p test-results
          pytest -q --maxfail=1 --junitxml=test-results/pytest.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results-${{ github.run_id }}
          path: rag-service/test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - dotnet
      - rag
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify required jobs
        shell: bash
        env:
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          RAG_RESULT: ${{ needs.rag.result }}
        run: |
          echo "ASP.NET Core: $DOTNET_RESULT"
          echo "FastAPI RAG:  $RAG_RESULT"

          [[ "$DOTNET_RESULT" == "success" ]]
          [[ "$RAG_RESULT" == "success" ]]
